# Render blueprint: managed Postgres + the LexPatent API.
# Create it from the Render dashboard: New > Blueprint > pick this repo.
# The frontend is deployed separately on Vercel.
databases:
  - name: lexpatent-db
    databaseName: lexpatent
    user: lexpatent
    plan: free

services:
  - type: web
    name: lexpatent-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexpatent-db
          property: connectionString
      # Generated once by Render and then kept; never commit real secrets.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set to the Vercel domain after the frontend is deployed.
      # Accepts a comma-separated list for preview domains.
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SIMULATED_DATE
        value: "2026-08-18"
