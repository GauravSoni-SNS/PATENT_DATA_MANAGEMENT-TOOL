# Render blueprint for the LexPatent API. The database lives on Neon.
# Create it from the Render dashboard: New > Blueprint > pick this repo.
# The frontend is deployed separately on Vercel.
services:
  - type: web
    name: lexpatent-api
    runtime: node
    plan: free
    rootDir: backend
    # The build must not touch the database: DATABASE_URL is absent from Render
    # build environments, so prisma db push runs in the start command, which
    # has the full runtime environment.
    buildCommand: npm ci && npm run render:build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set manually to the Neon connection string. Use the DIRECT host, not
      # the -pooler one: this is a long-lived Node process with its own Prisma
      # pool, and DDL (prisma db push) is unreliable through a transaction pooler.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and then kept; never commit real secrets.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set to the Vercel domain after the frontend is deployed.
      # Accepts a comma-separated list for preview domains.
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SIMULATED_DATE
        value: "2026-08-18"
      # EVE_OF | HALVING | DAILY - see docs/DEPLOYMENT.md
      - key: ALERT_SCHEDULE
        value: EVE_OF
      - key: ALERT_LEAD_DAYS
        value: "10"
      # Email alerts. Without these the API records alerts as undelivered
      # rather than pretending they were sent.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # WhatsApp alerts through Visity.
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
